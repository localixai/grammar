<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Localix — Connecting…</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: oklch(0.12 0 0);
        --fg: oklch(0.98 0 0);
        --text-soft: rgba(255,255,255,0.60);
        --text-faint: rgba(255,255,255,0.32);
        --border: oklch(0.22 0 0);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: oklch(0.985 0 0);
          --fg: oklch(0.15 0 0);
          --text-soft: rgba(0,0,0,0.58);
          --text-faint: rgba(0,0,0,0.32);
          --border: oklch(0.90 0 0);
        }
      }
      @keyframes logo-hover {
        0%   { transform: translate3d(0,0,0); }
        25%  { transform: translate3d(0,-6px,0); }
        50%  { transform: translate3d(0,0,0); }
        75%  { transform: translate3d(0,4px,0); }
        100% { transform: translate3d(0,0,0); }
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 40px 48px;
        text-align: center;
        animation: fade-up 0.4s ease both;
      }
      .logo {
        width: 72px;
        height: 72px;
        animation: logo-hover 4s ease-in-out infinite;
      }
      .logo img { width: 100%; height: 100%; display: block; }
      h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      p {
        font-size: 13px;
        color: var(--text-soft);
        max-width: 260px;
        line-height: 1.6;
      }
      .error { color: #f87171; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img src="/public/logo-dark.svg" alt="Localix" />
      </div>
      <h1 id="title">Connecting…</h1>
      <p id="message">Exchanging authorization code with OpenRouter.</p>
    </div>
    <script type="module" src="./callback.ts"></script>
  </body>
</html>
